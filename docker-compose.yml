services:
  fastapi:
    image: ${FASTAPI_IMAGE_TAG:-monkscode/nlrf:fastapi-latest}
    container_name: nlrf-fastapi
    ports:
      # Loopback-only (IPv4 AND IPv6): end users reach FastAPI only through the
      # nginx frontend (:3000), which overwrites X-Real-IP. Keeping the published
      # port off the network interface stops a remote client from hitting :5000
      # directly and spoofing X-Real-IP/X-Forwarded-For to bypass the per-IP auth
      # rate limit. Host-local debugging still works. Same dual-bind rationale as
      # postgres below (Windows resolves localhost to ::1 first).
      - "127.0.0.1:5000:5000"
      - "[::1]:5000:5000"
    volumes:
      # Persistent data volumes
      - ./robot_tests:/app/robot_tests
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      # Application configuration
      - APP_PORT=5000
      - BROWSER_USE_SERVICE_URL=http://browser-service:4999
      - RUNNER_EXEC_URL=http://runner-exec:4998
      # Docker-in-Docker: Host path for volume mounts in spawned containers
      - HOST_ROBOT_TESTS_DIR=${PWD}/robot_tests
      - HOST_WORKSPACE_DIR=${PWD}
      # Pre-generated libdocs live at /app/libdocs (outside the ./data volume mount)
      - LIBDOCS_DIR=/app/libdocs
      # Test runner image tag for spawned containers
      - TEST_RUNNER_IMAGE_TAG=${TEST_RUNNER_IMAGE_TAG:-monkscode/nlrf:test-runner-latest}
      # Disable ChromaDB telemetry (posthog API version mismatch causes noisy errors)
      - ANONYMIZED_TELEMETRY=False
      # Auth/users Postgres DSN — in-container host is the 'postgres' service name
      # (overrides the localhost value in src/backend/.env for the Docker network)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nlrf}:${POSTGRES_PASSWORD:-nlrf}@postgres:5432/${POSTGRES_DB:-nlrf}
      # In compose the SPA is the nginx container on :3000 — without this the
      # post-Google-login redirect lands on the dev-server URL (:5173) from
      # .env, which is dead in container mode. Override via shell env when
      # deploying behind a different host. GOOGLE_REDIRECT_URI stays
      # .env-driven: it must EXACTLY match what is registered with Google.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Load additional env vars from .env file
    env_file:
      - ./src/backend/.env
    depends_on:
      browser-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      runner-exec:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=fastapi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nlrf-network

  runner-exec:
    image: ${FASTAPI_IMAGE_TAG:-monkscode/nlrf:fastapi-latest}
    container_name: nlrf-runner-exec
    command: ["uvicorn", "src.backend.runner_exec.app:app", "--host", "0.0.0.0", "--port", "4998"]
    volumes:
      - ./robot_tests:/app/robot_tests
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOST_ROBOT_TESTS_DIR=${PWD}/robot_tests
      - HOST_WORKSPACE_DIR=${PWD}
      - TEST_RUNNER_IMAGE_TAG=${TEST_RUNNER_IMAGE_TAG:-monkscode/nlrf:test-runner-latest}
      - ANONYMIZED_TELEMETRY=False
    env_file:
      - ./src/backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4998/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nlrf-network

  browser-service:
    image: ${BROWSER_SERVICE_IMAGE_TAG:-monkscode/nlrf:browser-service-latest}
    container_name: nlrf-browser-service
    ports:
      # Loopback-only (IPv4 AND IPv6), same rationale as fastapi and postgres
      # below: this service drives a browser to caller-supplied URLs, and nothing
      # off-host needs it — fastapi reaches it as http://browser-service:4999 over
      # nlrf-network, which published ports do not affect. Both binds are required
      # because Windows resolves `localhost` to ::1 first and Docker Desktop
      # black-holes unbound IPv6 ports.
      - "127.0.0.1:4999:4999"
      - "[::1]:4999:4999"
    volumes:
      # Shared logs directory
      - ./logs:/app/logs
    environment:
      # Browser service configuration
      - BROWSER_USE_SERVICE_URL=http://browser-service:4999
      # Disable ChromaDB telemetry (posthog API version mismatch causes noisy errors)
      - ANONYMIZED_TELEMETRY=False
      # Load additional env vars from .env file
    env_file:
      - ./src/backend/.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=browser-service"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4999/probe', timeout=5).getcode()==200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - nlrf-network

  # --- Postgres (auth/users + the learning stack as of Phase 4). The pgvector
  # image (team-maintained, tracks PG releases) provides the `vector` extension
  # for the learning embeddings (slice 6); same PG 16, so pgdata is compatible. ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nlrf-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nlrf}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nlrf}
      - POSTGRES_DB=${POSTGRES_DB:-nlrf}
    ports:
      # Loopback-only (IPv4 AND IPv6): the DB is never exposed on the network
      # interface. Both binds are required — Windows resolves `localhost` to
      # ::1 first, and Docker Desktop black-holes unbound IPv6 ports (hangs,
      # not refused), which stalls every pooled connect by the full timeout.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlrf} -d ${POSTGRES_DB:-nlrf}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nlrf-network

  # --- React SPA microservice: nginx serves the build + reverse-proxies the API ---
  frontend:
    image: ${FRONTEND_IMAGE_TAG:-monkscode/nlrf:frontend-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nlrf-frontend
    ports:
      - "3000:8080"
    depends_on:
      - fastapi
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=frontend"
    healthcheck:
      # 127.0.0.1 (not localhost): busybox wget prefers ::1, nginx is IPv4-only
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nlrf-network

  # --- Observability profile: not started by a plain `docker compose up` ---
  # Run with: docker compose --profile observability up -d
  grafana-db-init:
    image: pgvector/pgvector:pg16
    container_name: nlrf-grafana-db-init
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-nlrf}
    volumes:
      - ./observability/postgres:/sql:ro
    entrypoint: ["psql"]
    command: >-
      -h postgres -U ${POSTGRES_USER:-nlrf} -d ${POSTGRES_DB:-nlrf}
      -v ON_ERROR_STOP=1
      -v grafana_password=${GRAFANA_DB_PASSWORD:-grafana_ro}
      -f /sql/create_readonly_role.sql
    restart: "no"
    networks:
      - nlrf-network

networks:
  nlrf-network:
    driver: bridge

volumes:
  pgdata:
