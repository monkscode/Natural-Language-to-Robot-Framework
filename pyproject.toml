[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-to-robot-framework"
version = "1.0.0"
description = "AI-powered natural language to Robot Framework test generation"
requires-python = ">=3.12"
authors = [
    {name = "monkscode", email = "1dhruvilvyas@gmail.com"},
]

dependencies = [
    # FastAPI core
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "requests",
    # Configuration
    "python-dotenv",
    # Fernet encryption for the org secret store (auth/secrets.py)
    "cryptography>=44",
    "PyYAML",
    # Docker SDK (robot test execution)
    "docker",
    # litellm is pinned to crewai 1.15.44's own [litellm] extra pin. A litellm bump can
    # change Vertex parameter mapping per model family — assert on the wire, not the name.
    # lancedb/pyarrow/qdrant-client/crewai-cli/cel-python (and their dependencies) are left out via
    # uv-overrides.txt: every `uv pip compile`
    # AND every install from the compiled file must pass `--overrides uv-overrides.txt`
    # (uv ignores [tool.uv] override-dependencies).
    "crewai==1.15.44",
    "litellm==1.105.3",
    # LLM providers
    "google-auth",
    # fastembed — standalone ONNX embeddings for the learning vectors on pgvector
    # (Phase 4 slice 6). Like ChromaDB it is onnxruntime-based; NO torch /
    # sentence-transformers (same constraint). We pin all-MiniLM-L6-v2 (384-dim),
    # the same model ChromaDB used, so similarity behaviour and the 0.55 threshold
    # carry over unchanged.
    "fastembed",
    # LLM Observability — OTel-first (Enhancement #3)
    "traceloop-sdk>=0.30.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    # Structured Logging (Enhancement #4)
    "structlog>=24.1.0",
    # Auth + Postgres (Phase 1: login/signup, JWT, Google SSO).
    # psycopg[binary] ships prebuilt wheels (no local libpq/compiler needed);
    # [pool] adds the ConnectionPool used by the auth store.
    "psycopg[binary,pool]",
    # Direct imports of the auth module. bcrypt reaches us only through this
    # declaration; PyJWT also arrives transitively via crewai. Both are declared
    # because the auth module imports them directly.
    # bcrypt is used directly (NOT via passlib, which breaks on bcrypt 5.x).
    "bcrypt>=4.1,<6",
    "PyJWT>=2.8,<3",
    # Authlib drives the server-side Google OAuth2/OIDC flow (token exchange +
    # id_token verification against Google's JWKS). Already present transitively;
    # declared here so the built image is guaranteed to include it.
    "authlib",
    # slowapi adds per-IP rate limiting on the unauthenticated auth endpoints
    # (login/register/forgot-password) to blunt brute-force / credential stuffing.
    # In-memory storage (single process); point at Redis if scaled horizontally.
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# S3 artifact-storage backend. boto3 is lazy-imported by S3ArtifactStore. litellm
# >=1.105 already depends on boto3, so this extra adds nothing today; it keeps the
# S3 backend working if litellm ever drops that dependency.
#   local/dev:  pip install -e '.[s3]'
#   Docker:     docker build --build-arg INSTALL_S3=true ... (see Dockerfile.fastapi)
s3 = [
    "boto3",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (may be slow)",
    "performance: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["src/backend"]
omit = ["*/venv/*", "*/__pycache__/*"]
