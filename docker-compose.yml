services:
  fastapi:
    image: ${FASTAPI_IMAGE_TAG:-monkscode/nlrf:fastapi-latest}
    container_name: nlrf-fastapi
    ports:
      - "5000:5000"
    volumes:
      # Persistent data volumes
      - ./robot_tests:/app/robot_tests
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      # Docker socket for robot test execution (Docker-in-Docker)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Application configuration
      - APP_PORT=5000
      - BROWSER_USE_SERVICE_URL=http://browser-service:4999
      # Docker-in-Docker: Host path for volume mounts in spawned containers
      - HOST_ROBOT_TESTS_DIR=${PWD}/robot_tests
      - HOST_WORKSPACE_DIR=${PWD}
      # Pre-generated libdocs live at /app/libdocs (outside the ./data volume mount)
      - LIBDOCS_DIR=/app/libdocs
      # Test runner image tag for spawned containers
      - TEST_RUNNER_IMAGE_TAG=${TEST_RUNNER_IMAGE_TAG:-monkscode/nlrf:test-runner-latest}
      # Disable ChromaDB telemetry (posthog API version mismatch causes noisy errors)
      - ANONYMIZED_TELEMETRY=False
      # Auth/users Postgres DSN — in-container host is the 'postgres' service name
      # (overrides the localhost value in src/backend/.env for the Docker network)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nlrf}:${POSTGRES_PASSWORD:-nlrf}@postgres:5432/${POSTGRES_DB:-nlrf}
      # Load additional env vars from .env file
    env_file:
      - ./src/backend/.env
    depends_on:
      browser-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=fastapi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nlrf-network

  browser-service:
    image: ${BROWSER_SERVICE_IMAGE_TAG:-monkscode/nlrf:browser-service-latest}
    container_name: nlrf-browser-service
    ports:
      - "4999:4999"
    volumes:
      # Shared logs directory
      - ./logs:/app/logs
    environment:
      # Browser service configuration
      - BROWSER_USE_SERVICE_URL=http://browser-service:4999
      # Disable ChromaDB telemetry (posthog API version mismatch causes noisy errors)
      - ANONYMIZED_TELEMETRY=False
      # Load additional env vars from .env file
    env_file:
      - ./src/backend/.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=browser-service"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4999/probe', timeout=5).getcode()==200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - nlrf-network

  # --- Postgres (auth/users + the learning stack as of Phase 4). The pgvector
  # image (team-maintained, tracks PG releases) provides the `vector` extension
  # for the learning embeddings (slice 6); same PG 16, so pgdata is compatible. ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nlrf-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nlrf}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nlrf}
      - POSTGRES_DB=${POSTGRES_DB:-nlrf}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlrf} -d ${POSTGRES_DB:-nlrf}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nlrf-network

  # --- React SPA microservice: nginx serves the build + reverse-proxies the API ---
  frontend:
    image: ${FRONTEND_IMAGE_TAG:-monkscode/nlrf:frontend-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nlrf-frontend
    ports:
      - "3000:80"
    depends_on:
      - fastapi
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=frontend"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nlrf-network

networks:
  nlrf-network:
    driver: bridge

volumes:
  pgdata:
