name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    # The test suite needs live Postgres + pgvector (optimization/api/trace/auth
    # tests run on isolated schemas). Credentials match the DATABASE_URL default
    # in src/backend/core/config.py; the schema bootstrap creates the extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nlrf
          POSTGRES_PASSWORD: nlrf
          POSTGRES_DB: nlrf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlrf -d nlrf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system pytest pytest-cov
          uv pip compile pyproject.toml \
            --python-platform linux \
            --python-version 3.12 \
            --output-file /tmp/requirements-ci.txt --quiet
          uv pip install --system -r /tmp/requirements-ci.txt

      # The pgvector tests embed with fastembed (all-MiniLM-L6-v2, ~80 MB ONNX
      # download on first use) — cache the model between runs.
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: data/fastembed_cache
          key: fastembed-all-MiniLM-L6-v2

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_integration \
            --cov=src/backend \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src/backend

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
