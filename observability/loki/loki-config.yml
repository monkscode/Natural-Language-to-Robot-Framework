# Single-binary Loki with filesystem storage. This is a developer-stack log
# store for run tracing, not a production log platform.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: false
  # Off because Alloy stamps detected_level from the application's own level
  # field (observability/alloy/config.alloy). Left on, Loki re-guesses the
  # level from raw text and overrides every line Alloy stamped `unknown` —
  # it treats that string as absent rather than as a stamp. Our prompt
  # headings, `--- CRITICAL: ... ---`, were stored as critical that way.
  discover_log_levels: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
