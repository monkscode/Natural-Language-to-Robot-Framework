<!DOCTYPE html>
<html lang="en" data-theme="professional">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark 1 — Learning Dashboard</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;800&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.2">

    <style>
        /* ── Learning page layout ── */
        .lrn-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem 3rem;
        }

        .nav-btn {
            padding: 8px 16px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
        }
        [data-theme="neobrutalism"] .nav-btn {
            border: 3px solid var(--border-color);
            border-radius: 0;
            box-shadow: 4px 4px 0 0 var(--text-main);
        }

        /* ── Sub-nav ── */
        .lrn-subnav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .lrn-breadcrumb {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .lrn-subnav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .lrn-tab {
            padding: 6px 14px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            border-radius: var(--border-radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.1s;
        }
        .lrn-tab:hover { background: var(--bg-surface-secondary); }
        .lrn-tab.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--bg-surface-secondary);
        }
        [data-theme="neobrutalism"] .lrn-tab {
            border: 3px solid var(--border-color);
            border-radius: 0;
            box-shadow: 3px 3px 0 0 var(--text-main);
        }

        /* ── Filters ── */
        .lrn-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .lrn-filter-select, .lrn-filter-input {
            padding: 6px 10px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            border-radius: var(--border-radius-sm);
            font-size: 0.85rem;
            font-family: var(--font-main);
            outline: none;
        }
        .lrn-filter-input { min-width: 220px; }

        /* ── Hint card ── */
        .lrn-hint-card {
            background: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            box-shadow: var(--shadow-sm);
        }
        .lrn-hint-card-top {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.4rem;
        }
        .lrn-hint-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
            word-break: break-word;
        }
        .lrn-hint-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .lrn-hint-meta span + span::before { content: ' · '; }
        .lrn-hint-flag-reason {
            font-size: 0.78rem;
            color: var(--warning);
            margin-bottom: 0.5rem;
            font-style: italic;
        }
        .lrn-hint-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        /* ── Status badges ── */
        .lrn-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .lrn-badge-flagged      { background: rgba(239,68,68,0.15);  color: var(--error); }
        .lrn-badge-active       { background: rgba(16,185,129,0.15); color: var(--success); }
        .lrn-badge-retracted    { background: rgba(100,116,139,0.15);color: var(--text-secondary); }
        .lrn-badge-disabled     { background: rgba(245,158,11,0.15); color: var(--warning); }
        .lrn-badge-llm-disabled { background: rgba(139,92,246,0.15); color: #7c3aed; }
        [data-theme="neobrutalism"] .lrn-badge { border: 2px solid currentColor; border-radius: 0; }

        /* ── Small buttons ── */
        .lrn-btn {
            padding: 4px 12px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-surface-secondary);
            color: var(--text-main);
            border-radius: var(--border-radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-main);
            white-space: nowrap;
        }
        .lrn-btn:hover { background: var(--bg-surface); }
        .lrn-btn-danger  { color: var(--error);   border-color: var(--error); }
        .lrn-btn-danger:hover  { background: rgba(239,68,68,0.08); }
        .lrn-btn-warn    { color: var(--warning); border-color: var(--warning); }
        .lrn-btn-warn:hover    { background: rgba(245,158,11,0.08); }
        .lrn-btn-success { color: var(--success); border-color: var(--success); }
        .lrn-btn-success:hover { background: rgba(16,185,129,0.08); }
        [data-theme="neobrutalism"] .lrn-btn {
            border: 3px solid var(--border-color);
            border-radius: 0;
            box-shadow: 3px 3px 0 0 var(--text-main);
        }

        /* ── List footer / load more ── */
        .lrn-list-footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ── States ── */
        .lrn-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .lrn-loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ── Modal ── */
        .lrn-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .lrn-modal {
            background: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .lrn-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: var(--border-width) solid var(--border-color);
        }
        .lrn-modal-title { font-weight: 700; font-size: 1rem; }
        .lrn-modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
        }
        .lrn-modal-close:hover { color: var(--text-main); background: var(--bg-surface-secondary); }
        .lrn-modal-body   { padding: 1.25rem; }
        .lrn-modal-footer {
            padding: 1rem 1.25rem;
            border-top: var(--border-width) solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        /* ── Form elements ── */
        .lrn-form-group { margin-bottom: 1rem; }
        .lrn-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.35rem;
        }
        .lrn-input, .lrn-select, .lrn-textarea {
            width: 100%;
            padding: 7px 10px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            border-radius: var(--border-radius-sm);
            font-family: var(--font-main);
            font-size: 0.875rem;
            outline: none;
        }
        .lrn-textarea { resize: vertical; min-height: 80px; }
        .lrn-char-count { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 2px; }
        .lrn-char-count.over { color: var(--error); }
        .lrn-radio-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .lrn-radio-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer; }
        .lrn-scope-sub {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1.5rem;
            margin-top: 0.25rem;
        }
        .lrn-scope-sub label { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; }
        .lrn-scope-sub input {
            flex: 1;
            padding: 4px 8px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            border-radius: var(--border-radius-sm);
            font-family: var(--font-main);
            font-size: 0.85rem;
        }
        .lrn-hint-text-small { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
        .lrn-checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer; }

        /* ── Drawer ── */
        .lrn-drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 900;
        }
        .lrn-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(580px, 100vw);
            background: var(--bg-surface);
            border-left: var(--border-width) solid var(--border-color);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .lrn-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
        }
        .lrn-drawer-title { font-weight: 700; font-size: 0.95rem; }
        .lrn-drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem; }
        .lrn-drawer-section { margin-bottom: 1.25rem; }
        .lrn-drawer-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .lrn-kv-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 0.83rem;
        }
        .lrn-kv-row span:first-child { color: var(--text-secondary); }
        .lrn-kv-row span:last-child  { font-weight: 600; font-family: var(--font-mono); font-size: 0.8rem; }
        .lrn-drawer-hint-text {
            background: var(--bg-surface-secondary);
            border-radius: var(--border-radius-sm);
            padding: 0.75rem;
            font-size: 0.875rem;
            line-height: 1.6;
            word-break: break-word;
        }
        .lrn-drawer-edit-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .lrn-drawer-edit-row .lrn-select { width: auto; flex: 1; min-width: 120px; }

        /* ── Timeline ── */
        .lrn-timeline { list-style: none; }
        .lrn-timeline-item {
            display: flex;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.83rem;
        }
        .lrn-timeline-item:last-child { border-bottom: none; }
        .lrn-timeline-when { color: var(--text-muted); white-space: nowrap; min-width: 72px; }
        .lrn-timeline-body { flex: 1; }
        .lrn-timeline-actor { font-weight: 600; color: var(--text-main); }
        .lrn-timeline-reason { color: var(--text-secondary); font-style: italic; margin-top: 2px; font-size: 0.78rem; white-space: pre-wrap; word-break: break-word; }
        .lrn-clamp-wrap { display: block; }
        .lrn-clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
        .lrn-clamp--expanded { display: block; overflow: visible; }
        .lrn-clamp-toggle { display: inline-block; margin-top: 3px; background: none; border: none; padding: 0; cursor: pointer; color: var(--accent, #2563eb); font-size: 0.72rem; font-weight: 600; }
        .lrn-clamp-toggle:hover { text-decoration: underline; }
        .lrn-clamp-toggle[hidden] { display: none; }   /* author display must not defeat the hidden attr */

        /* ── Trigger events table ── */
        .lrn-table-card {
            background: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .lrn-table-header {
            padding: 1rem 1.25rem;
            border-bottom: var(--border-width) solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .lrn-table-header-title { font-weight: 700; font-size: 0.95rem; }
        .lrn-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .lrn-table th, .lrn-table td {
            padding: 0.65rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .lrn-table th {
            background: var(--bg-surface-secondary);
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .lrn-table tbody tr:hover { background: var(--bg-surface-secondary); cursor: pointer; }
        .lrn-flagged-badge { color: var(--error); font-weight: 700; font-size: 0.78rem; }

        /* ── Code diff ── */
        .lrn-code-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .lrn-code-block {
            background: var(--bg-surface-secondary);
            border-radius: var(--border-radius-sm);
            padding: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            overflow: auto;
            max-height: 320px;
            white-space: pre;
            word-break: normal;
        }
        @media (max-width: 640px) { .lrn-code-pair { grid-template-columns: 1fr; } }

        /* ── Stats ── */
        .lrn-stats-legend {
            background: var(--bg-surface-secondary);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }
        .lrn-stats-section {
            background: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
        }
        .lrn-stats-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }
        .lrn-stats-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; }
        .lrn-stat-item  { display: flex; flex-direction: column; gap: 2px; }
        .lrn-stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lrn-stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            font-family: var(--font-display);
            color: var(--text-main);
        }

        /* ── KPI block ── */
        .lrn-kpi-block {
            border-left: 3px solid var(--primary);
            padding-left: 1rem;
            margin: 0.5rem 0;
        }
        .lrn-kpi-row {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            flex-wrap: wrap;
        }
        .lrn-kpi-label {
            color: var(--text-secondary);
            min-width: 170px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
        }
        .lrn-kpi-val { font-weight: 700; font-family: var(--font-mono); font-size: 0.9rem; }
        .lrn-kpi-note { font-size: 0.78rem; color: var(--text-muted); }
        .lrn-kpi-val.rate-good { color: var(--success); }
        .lrn-kpi-val.rate-warn { color: var(--warning); }
        .lrn-kpi-val.rate-bad  { color: var(--error); }

        /* ── Info / tooltip icon ── */
        .lrn-info {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 1px solid var(--text-muted);
            font-size: 0.62rem;
            color: var(--text-muted);
            cursor: help;
            position: relative;
            user-select: none;
            flex-shrink: 0;
            font-style: normal;
        }
        .lrn-info::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-main);
            color: var(--bg-surface);
            font-size: 0.75rem;
            font-weight: 400;
            line-height: 1.45;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            width: 260px;
            white-space: normal;
            z-index: 1100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .lrn-info:hover::after { opacity: 1; }

        /* ── Health banner ── */
        .lrn-health-banner { margin-bottom: 1rem; }
        .lrn-health-banner:empty { display: none; }
        .lrn-health-banner-inner {
            padding: 0.6rem 1rem;
            border-radius: var(--border-radius-sm);
            border: var(--border-width) solid;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .lrn-health-ok       { background: rgba(16,185,129,0.12); color: var(--success);        border-color: var(--success); }
        .lrn-health-degraded { background: rgba(245,158,11,0.12); color: var(--warning);        border-color: var(--warning); }
        .lrn-health-failed   { background: rgba(239,68,68,0.12);  color: var(--error);          border-color: var(--error); }
        .lrn-health-disabled { background: rgba(100,116,139,0.12);color: var(--text-secondary); border-color: var(--text-secondary); }

        /* ── Back link ── */
        .lrn-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            margin-bottom: 1rem;
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            font-family: var(--font-main);
        }
        .lrn-back-link:hover { color: var(--text-main); }

        @media (max-width: 640px) {
            .lrn-container { padding: 1rem; }
            .lrn-subnav { flex-direction: column; align-items: flex-start; }
        }

        /* ── LLM Review section ── */
        .review-header { display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap; }
        .review-sessions-table { width:100%; border-collapse:collapse; font-size:0.875rem; }
        .review-sessions-table th { text-align:left; padding:6px 10px; border-bottom:2px solid var(--border-color); font-weight:600; color:var(--text-secondary); }
        .review-sessions-table td { padding:8px 10px; border-bottom:1px solid var(--border-color); vertical-align:top; }
        .review-sessions-table tr:hover td { background:var(--bg-hover); cursor:pointer; }
        .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.75rem; font-weight:600; }
        .badge-pending-llm  { background:#fef3c7; color:#92400e; }
        .badge-pending-review { background:#fef9c3; color:#78350f; }
        .badge-completed    { background:#dcfce7; color:#166534; }
        .badge-failed       { background:#fee2e2; color:#991b1b; }
        .review-panel { margin-top:1.5rem; }
        .review-panel-title { font-size:1rem; font-weight:700; margin-bottom:0.75rem; }
        .rec-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
        .rec-table th { text-align:left; padding:5px 8px; border-bottom:2px solid var(--border-color); font-weight:600; color:var(--text-secondary); }
        .rec-table td { padding:7px 8px; border-bottom:1px solid var(--border-color); vertical-align:top; }
        .badge-keep       { background:#dcfce7; color:#166534; }
        .badge-disable    { background:#fee2e2; color:#991b1b; }
        .badge-reactivate { background:#dbeafe; color:#1e40af; }
        .badge-flag_review { background:#fef9c3; color:#78350f; }
        .badge-unflag      { background:#ccfbf1; color:#115e59; }
        .badge-approved   { background:#dcfce7; color:#166534; }
        .badge-rejected   { background:#f3f4f6; color:#6b7280; }
        .rec-decision-btns { display:flex; gap:6px; flex-wrap:wrap; }
