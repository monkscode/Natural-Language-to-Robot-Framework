apiVersion: 1

providers:
  - name: mark1
    orgId: 1
    folder: Mark 1
    type: file
    disableDeletion: true
    # Committed JSON is the source of truth. UI edits are not persisted back.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
