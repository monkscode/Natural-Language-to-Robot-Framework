# nginx config for the React SPA microservice.
# Serves the built bundle and reverse-proxies backend paths to the FastAPI
# service ("fastapi" is the docker-compose service name on nlrf-network), so the
# SPA and API share one origin — no CORS needed inside the compose network.

server {
    listen 8080;  # non-root nginx (nginx-unprivileged) cannot bind ports < 1024
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the bundle + JSON API responses (SSE streams are text/event-stream,
    # not in this list, so streaming latency is unaffected).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Browser hardening. NOTE: nginx add_header inheritance — any location that
    # sets its own add_header drops these, so /assets/ repeats them below.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Common proxy headers, inherited by the proxied locations below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Backend (FastAPI) ---
    location /api/ {
        proxy_pass http://fastapi:5000;
        # Server-Sent Events (generate/execute streams): stream immediately,
        # never buffer/cache, and allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /auth/ {
        proxy_pass http://fastapi:5000;
    }
    location /reports/ {
        proxy_pass http://fastapi:5000;
    }
    location = /health {
        proxy_pass http://fastapi:5000;
    }

    # Root-level backend routes (mounted outside /api). The generate/execute/run
    # endpoints stream SSE, so disable buffering and allow long-lived connections.
    location = /generate-test {
        proxy_pass http://fastapi:5000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /execute-test {
        proxy_pass http://fastapi:5000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /generate-and-run {
        proxy_pass http://fastapi:5000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /docker-status        { proxy_pass http://fastapi:5000; }
    location = /rebuild-docker-image { proxy_pass http://fastapi:5000; }
    location /test/                  { proxy_pass http://fastapi:5000; }

    # --- Static assets — long cache (Vite emits content-hashed filenames) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare the security headers — this block's add_header above stops
        # inheritance of the server-level set.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- SPA fallback — client-side routes resolve to index.html ---
    location / {
        # CSP for the SPA documents ONLY — never on the proxied locations:
        # Robot Framework's log.html/report.html (under /reports) rely on
        # inline scripts and would break. The app bundle is fully self-hosted
        # (no CDN); webfonts are bundled from @fontsource-variable, so no
        # fonts.googleapis.com request is needed — an earlier remote @import was
        # silently blocked by this very policy and the UI fell back to system
        # fonts. style-src needs 'unsafe-inline' for React style={} attributes.
        # font-src must be declared: Vite inlines any font subset under its
        # 4 KB threshold as a data: URI, and default-src 'self' would block it.
        # data: is safe for fonts — they are passive resources and cannot
        # execute, which is why img-src already allows it too.
        # With the JWT in localStorage, XSS is the primary threat this mitigates.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # Re-declare — this block's add_header stops server-level inheritance.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
