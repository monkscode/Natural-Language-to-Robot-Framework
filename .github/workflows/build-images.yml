name: Build and Push Docker Images

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'browser_service/**'
      - 'browser-service/**'
      - 'Dockerfile.fastapi'
      - 'Dockerfile.frontend'
      - 'Dockerfile.browser-service'
      - 'Dockerfile.base-browser'
      - 'Dockerfile.test-runner'
      - '.github/workflows/build-images.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'browser_service/**'
      - 'browser-service/**'
      - 'Dockerfile.fastapi'
      - 'Dockerfile.frontend'
      - 'Dockerfile.browser-service'
      - 'Dockerfile.base-browser'
      - 'Dockerfile.test-runner'
      - '.github/workflows/build-images.yml'

  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all images'
        required: false
        default: 'false'

env:
  REGISTRY: docker.io
  IMAGE_NAME: monkscode/nlrf

# One build per ref at a time. The branch tags (`-develop`, `-latest`) are what
# users pull, and two runs in flight can finish out of order, leaving the tag
# pointing at the older commit with nothing to show that happened.
#
# A push run is NEVER cancelled. It pushes five images one job at a time, so
# killing it mid-run can leave `-develop` on a different commit per service —
# the mixed set .env.example calls the usual cause of odd boot and login errors.
# Serialising instead means the older run finishes consistently and the newer
# one then overwrites it, also consistently. A pull_request run pushes nothing,
# so cancelling a superseded one costs nothing.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing may be built, and above all nothing may be PUSHED, until the suite
  # that judges this commit has passed. build-images.yml and sonarqube.yml are
  # both fired by the same push and were completely independent, so a red suite
  # still overwrote `-develop` — the tag the README tells every user to pull —
  # with no signal that anything was wrong.
  #
  # This deliberately re-runs a suite sonarqube.yml also runs. The alternatives
  # were worse: `workflow_run` gating only fires from the DEFAULT branch, which
  # is the same trap that leaves check-browser-service-release.yml inert on
  # develop, and sharing one run needs the coverage artifact plumbed between
  # workflows. A few duplicated CI minutes buy a gate that is obvious from this
  # file alone. Kept honest by tests/test_build_manifests.py.
  test:
    name: Test suite (publish gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Same stack the suite needs locally: optimization, api, trace and auth
    # tests run against live Postgres on isolated schemas. Credentials match the
    # DATABASE_URL default in src/backend/core/config.py.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nlrf
          POSTGRES_PASSWORD: nlrf
          POSTGRES_DB: nlrf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlrf -d nlrf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system pytest
          uv pip compile pyproject.toml             --python-platform linux             --python-version 3.12             --output-file /tmp/requirements-ci.txt --quiet
          uv pip install --system -r /tmp/requirements-ci.txt

      # all-MiniLM-L6-v2 is a ~80 MB ONNX download on first use.
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: data/fastembed_cache
          key: fastembed-all-MiniLM-L6-v2

      - name: Run the suite
        run: pytest tests/ --ignore=tests/test_integration -q
        env:
          PYTHONPATH: ${{ github.workspace }}/src/backend
          # App startup refuses the placeholder secret; tests that boot the app
          # need a real-looking one.
          JWT_SECRET_KEY: ci-only-jwt-secret-not-used-outside-this-workflow

  build-base-browser:
    name: Build Base Browser Image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      base_image_tag: ${{ steps.base_tag.outputs.base_image_tag }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=base-browser-
            type=ref,event=pr,prefix=base-browser-pr-
            type=sha,prefix=base-browser-,format=short
            type=raw,value=base-browser-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Base Browser image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base-browser
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-browser-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:base-browser-buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          platforms: linux/amd64

      - name: Select base image tag output
        id: base_tag
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            first_tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
            if [ -z "$first_tag" ]; then
              echo "No base-browser tag produced by metadata-action" >&2
              exit 1
            fi
            echo "base_image_tag=$first_tag" >> "$GITHUB_OUTPUT"
          else
            # For PRs: dependent jobs use the existing stable base image since the freshly built one is not pushed
            echo "base_image_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-browser-develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Get image size
        id: image_size
        run: |
          first_tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          SIZE_BYTES=$(docker manifest inspect "$first_tag" -v 2>/dev/null | jq '[.[] | .OCIManifest // .SchemaV2Manifest | .layers[]?.size // 0] | add // 0' 2>/dev/null || echo 0)
          if [ "$SIZE_BYTES" -gt 0 ] 2>/dev/null; then
            SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
            echo "image_size=${SIZE_GB}GB" >> "$GITHUB_OUTPUT"
          else
            echo "image_size=unknown" >> "$GITHUB_OUTPUT"
          fi

  build-fastapi:
    name: Build FastAPI Image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_size: ${{ steps.image_size.outputs.image_size }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=fastapi-
            type=ref,event=pr,prefix=fastapi-pr-
            type=sha,prefix=fastapi-,format=short
            type=raw,value=fastapi-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=fastapi-develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.fastapi
          push: ${{ github.event_name != 'pull_request' }}
          # Stamped into the image as an OCI revision label (and, for the
          # backend, an env var /health reports). Branch tags move, so this is
          # the only thing that identifies the code inside a pulled image.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:fastapi-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:fastapi-buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          platforms: linux/amd64

      - name: Get image size
        id: image_size
        run: |
          first_tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          SIZE_BYTES=$(docker manifest inspect "$first_tag" -v 2>/dev/null | jq '[.[] | .OCIManifest // .SchemaV2Manifest | .layers[]?.size // 0] | add // 0' 2>/dev/null || echo 0)
          if [ "$SIZE_BYTES" -gt 0 ] 2>/dev/null; then
            SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
            echo "image_size=${SIZE_GB}GB" >> "$GITHUB_OUTPUT"
          else
            echo "image_size=unknown" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_size: ${{ steps.image_size.outputs.image_size }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=frontend-
            type=ref,event=pr,prefix=frontend-pr-
            type=sha,prefix=frontend-,format=short
            type=raw,value=frontend-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=frontend-develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          # Stamped into the image as an OCI revision label (and, for the
          # backend, an env var /health reports). Branch tags move, so this is
          # the only thing that identifies the code inside a pulled image.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:frontend-buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          platforms: linux/amd64

      - name: Get image size
        id: image_size
        run: |
          first_tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          SIZE_BYTES=$(docker manifest inspect "$first_tag" -v 2>/dev/null | jq '[.[] | .OCIManifest // .SchemaV2Manifest | .layers[]?.size // 0] | add // 0' 2>/dev/null || echo 0)
          if [ "$SIZE_BYTES" -gt 0 ] 2>/dev/null; then
            SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
            echo "image_size=${SIZE_GB}GB" >> "$GITHUB_OUTPUT"
          else
            echo "image_size=unknown" >> "$GITHUB_OUTPUT"
          fi

  build-browser-service:
    name: Build Browser Service Image
    runs-on: ubuntu-latest
    needs: [test, build-base-browser]
    outputs:
      image_size: ${{ steps.image_size.outputs.image_size }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=browser-service-
            type=ref,event=pr,prefix=browser-service-pr-
            type=sha,prefix=browser-service-,format=short
            type=raw,value=browser-service-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=browser-service-develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Browser Service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.browser-service
          push: ${{ github.event_name != 'pull_request' }}
          # Stamped into the image as an OCI revision label (and, for the
          # backend, an env var /health reports). Branch tags move, so this is
          # the only thing that identifies the code inside a pulled image.
          build-args: |
            BASE_IMAGE=${{ needs.build-base-browser.outputs.base_image_tag }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:browser-service-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:browser-service-buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          platforms: linux/amd64

      - name: Get image size
        id: image_size
        run: |
          first_tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          SIZE_BYTES=$(docker manifest inspect "$first_tag" -v 2>/dev/null | jq '[.[] | .OCIManifest // .SchemaV2Manifest | .layers[]?.size // 0] | add // 0' 2>/dev/null || echo 0)
          if [ "$SIZE_BYTES" -gt 0 ] 2>/dev/null; then
            SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
            echo "image_size=${SIZE_GB}GB" >> "$GITHUB_OUTPUT"
          else
            echo "image_size=unknown" >> "$GITHUB_OUTPUT"
          fi

  build-test-runner:
    name: Build Test Runner Image
    runs-on: ubuntu-latest
    needs: [test, build-base-browser]
    outputs:
      image_size: ${{ steps.image_size.outputs.image_size }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=test-runner-
            type=ref,event=pr,prefix=test-runner-pr-
            type=sha,prefix=test-runner-,format=short
            type=raw,value=test-runner-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=test-runner-develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Test Runner image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.test-runner
          push: ${{ github.event_name != 'pull_request' }}
          # Stamped into the image as an OCI revision label (and, for the
          # backend, an env var /health reports). Branch tags move, so this is
          # the only thing that identifies the code inside a pulled image.
          build-args: |
            BASE_IMAGE=${{ needs.build-base-browser.outputs.base_image_tag }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-runner-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:test-runner-buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          platforms: linux/amd64

      - name: Get image size
        id: image_size
        run: |
          first_tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          SIZE_BYTES=$(docker manifest inspect "$first_tag" -v 2>/dev/null | jq '[.[] | .OCIManifest // .SchemaV2Manifest | .layers[]?.size // 0] | add // 0' 2>/dev/null || echo 0)
          if [ "$SIZE_BYTES" -gt 0 ] 2>/dev/null; then
            SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
            echo "image_size=${SIZE_GB}GB" >> "$GITHUB_OUTPUT"
          else
            echo "image_size=unknown" >> "$GITHUB_OUTPUT"
          fi

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build-base-browser, build-fastapi, build-frontend, build-browser-service, build-test-runner]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Docker Image Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Images Built:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Base Browser**: \`${{ env.IMAGE_NAME }}:base-browser-*\` (${{ needs.build-base-browser.outputs.image_size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **FastAPI**: \`${{ env.IMAGE_NAME }}:fastapi-*\` (${{ needs.build-fastapi.outputs.image_size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend**: \`${{ env.IMAGE_NAME }}:frontend-*\` (${{ needs.build-frontend.outputs.image_size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Browser Service**: \`${{ env.IMAGE_NAME }}:browser-service-*\` (${{ needs.build-browser-service.outputs.image_size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Test Runner**: \`${{ env.IMAGE_NAME }}:test-runner-*\` (${{ needs.build-test-runner.outputs.image_size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "🚫 **Status**: publish gate failed — the test suite did not pass, so no image was built or pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "- Test suite: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-base-browser.result }}" = "success" ] && [ "${{ needs.build-fastapi.result }}" = "success" ] && [ "${{ needs.build-browser-service.result }}" = "success" ] && [ "${{ needs.build-test-runner.result }}" = "success" ]; then
            echo "✅ **Status**: All images built successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Status**: Some builds failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Base Browser: ${{ needs.build-base-browser.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- FastAPI: ${{ needs.build-fastapi.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Browser Service: ${{ needs.build-browser-service.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Test Runner: ${{ needs.build-test-runner.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi
