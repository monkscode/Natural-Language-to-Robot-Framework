# nginx config for the React SPA microservice.
# Serves the built bundle and reverse-proxies backend paths to the FastAPI
# service ("fastapi" is the docker-compose service name on nlrf-network), so the
# SPA and API share one origin — no CORS needed inside the compose network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Common proxy headers, inherited by the proxied locations below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Backend (FastAPI) ---
    location /api/ {
        proxy_pass http://fastapi:5000;
        # Server-Sent Events (generate/execute streams): stream immediately,
        # never buffer/cache, and allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /auth/ {
        proxy_pass http://fastapi:5000;
    }
    location /reports/ {
        proxy_pass http://fastapi:5000;
    }
    location = /health {
        proxy_pass http://fastapi:5000;
    }

    # Root-level backend routes (mounted outside /api). The generate/execute/run
    # endpoints stream SSE, so disable buffering and allow long-lived connections.
    location = /generate-test {
        proxy_pass http://fastapi:5000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /execute-test {
        proxy_pass http://fastapi:5000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /generate-and-run {
        proxy_pass http://fastapi:5000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /docker-status        { proxy_pass http://fastapi:5000; }
    location = /rebuild-docker-image { proxy_pass http://fastapi:5000; }
    location /test/                  { proxy_pass http://fastapi:5000; }

    # --- Static assets — long cache (Vite emits content-hashed filenames) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback — client-side routes resolve to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
